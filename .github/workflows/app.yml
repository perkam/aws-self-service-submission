name: app

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Commit SHA of a published image to redeploy. Leave empty to build this commit.
        type: string
        required: false

permissions:
  contents: read

env:
  AWS_REGION: eu-north-1
  IMAGE: 017636909328.dkr.ecr.eu-north-1.amazonaws.com/status-api

jobs:
  build:
    if: ${{ !inputs.image_tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the job assume the AWS role through GitHub OIDC
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: app/.tool-versions
          cache: false # no dependencies to cache

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::017636909328:role/status-api-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      # Pull requests and other branches only build the image. Runs on main also publish it.
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          platforms: linux/amd64
          build-args: VERSION=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          push: ${{ github.ref == 'refs/heads/main' }}
          provenance: false # avoids extra untagged entries in ECR
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    needs: build
    # Also runs when the build is skipped because an existing image is being redeployed.
    if: >-
      ${{
        !cancelled()
        && github.ref == 'refs/heads/main'
        && (needs.build.result == 'success' || needs.build.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # lets the job assume the AWS role through GitHub OIDC
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::017636909328:role/status-api-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Download latest task definition
        run: >-
          aws ecs describe-task-definition
          --task-definition status-api
          --query taskDefinition
          > task-definition.json

      - name: Set the image in the task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: task-definition.json
          container-name: status-api
          image: ${{ env.IMAGE }}:${{ inputs.image_tag || github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: self-service
          service: status-api
          wait-for-service-stability: true
          wait-for-minutes: 15
